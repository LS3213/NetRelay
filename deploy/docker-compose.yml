services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${NETRELAY_MYSQL_DATABASE}
      MYSQL_USER: ${NETRELAY_MYSQL_USER}
      MYSQL_PASSWORD: ${NETRELAY_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NETRELAY_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  netrelay-api:
    build:
      context: ..
      dockerfile: server/NetRelay.Server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NetRelay: Server=mysql;Port=3306;Database=${NETRELAY_MYSQL_DATABASE};User=${NETRELAY_MYSQL_USER};Password=${NETRELAY_MYSQL_PASSWORD}
      NetRelay__PublicBaseUrl: ${NETRELAY_PUBLIC_BASE_URL}
      NetRelay__GithubRepository: ${NETRELAY_GITHUB_REPOSITORY}
      NetRelay__ReleasesRoot: /var/lib/netrelay/releases
      NetRelay__FeedbackRoot: /var/lib/netrelay/feedback-attachments
      NetRelay__StagingRoot: /var/lib/netrelay/staging
      NetRelay__QuarantineRoot: /var/lib/netrelay/quarantine
      NetRelay__AutoMigrate: "false"
      BootstrapAdmin__Username: ${NETRELAY_ADMIN_USERNAME}
      BootstrapAdmin__Password: ${NETRELAY_ADMIN_PASSWORD}
      BootstrapAdmin__TotpSecret: ${NETRELAY_ADMIN_TOTP_SECRET}
      DataProtection__KeysPath: /var/lib/netrelay/data-protection
    volumes:
      - data-protection:/var/lib/netrelay/data-protection
      - releases:/var/lib/netrelay/releases
      - feedback-attachments:/var/lib/netrelay/feedback-attachments
      - staging:/var/lib/netrelay/staging
      - quarantine:/var/lib/netrelay/quarantine
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      netrelay-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/netrelay.conf:/etc/nginx/conf.d/default.conf:ro
      - ../website:/usr/share/nginx/html:ro
      - ../website/admin/dist:/usr/share/nginx/html/admin:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal

volumes:
  mysql-data:
  data-protection:
  releases:
  feedback-attachments:
  staging:
  quarantine:

networks:
  internal:
    internal: true
